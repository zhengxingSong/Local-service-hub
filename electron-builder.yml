appId: com.local.service-hub
productName: 服务中枢
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  # 写入 exe 图标与版本信息（产品名/公司/版权/版本），使属性页与任务管理器不再显示 Electron
  signAndEditExecutable: true
  # 未配置证书时不签名（仅在提供 CSC_LINK 时签名）
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 服务中枢
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# electron-builder 从 npmmirror 拉取 NSIS/winCodeSign 等构建工具
npmRebuild: false
