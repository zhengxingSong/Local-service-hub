    <!--
      结构探针：渲染完成后断言真实应用的 DOM 结构与 Carbon 不变式，
      结果写进 <pre id="dshverifyout">，由 shot-renderer.ps1 -Probe 用 --dump-dom 取回。
      （Chrome 的 --dump-dom 不输出 console，所以必须写进 DOM。）
    -->
    <script>
      window.addEventListener('load', function () {
        var out = [];
        function q(s) { return document.querySelector(s); }
        function qa(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
        function txt(s) { var e = q(s); return e ? e.innerText.replace(/\s+/g, ' ') : ''; }
        function mark(n, ok, extra) { out.push((ok ? 'PASS' : 'FAIL') + ' | ' + n + (extra ? ' | ' + extra : '')); }
        function byText(t) {
          var c = qa('button,[role=button],a').filter(function (e) { return e.textContent.trim() === t; });
          return c[0] || null;
        }
        function finish() {
          var pre = document.createElement('pre');
          pre.id = 'dshverifyout';
          pre.textContent = out.join('\n');
          document.body.appendChild(pre);
        }

        /* 阶段一：运行态（用途卡 + 资源账本） */
        function phase1() {
          var purposes = qa('.purpose');
          mark('运行态·用途卡（2 个预设组）', purposes.length === 2, purposes.length + ' 张');
          mark('运行态·未分组单成员卡（3 个）', qa('.cards .card').length === 3, qa('.cards .card').length + ' 张');
          mark('运行态·用途卡可展开', qa('.purpose-toggle').length === purposes.length);
          mark('运行态·成员行存在', qa('.member').length >= 1, qa('.member').length + ' 行');
          mark('运行态·账本存在', !!q('.ledger') && txt('.ledger-head').indexOf('资源') >= 0);
          mark('运行态·账本显存读数', /GB/.test(txt('.ledger-sub')), txt('.ledger-sub').slice(0, 48));
          mark('运行态·账本行列', qa('.ledger-item').length >= 5, qa('.ledger-item').length + ' 行');
          mark('运行态·可启动与差容量', qa('.ledger-fit.ok').length >= 1 && qa('.ledger-fit.bad').length >= 1,
            '可启动 ' + qa('.ledger-fit.ok').length + ' · 差容量 ' + qa('.ledger-fit.bad').length);
          mark('Carbon·0px 圆角', qa('.purpose, .ledger, .btn').every(function (e) {
            return getComputedStyle(e).borderTopLeftRadius === '0px';
          }));
          mark('Carbon·卡片无投影', qa('.purpose, .ledger, .card').every(function (e) {
            return getComputedStyle(e).boxShadow === 'none';
          }));
          mark('Carbon·无渐变底', getComputedStyle(document.body).backgroundImage === 'none');
          mark('Carbon·正文 0.16px 字距', getComputedStyle(document.body).letterSpacing === '0.16px',
            getComputedStyle(document.body).letterSpacing);

          var cfgBtn = byText('配置');
          if (!cfgBtn) { out.push('MISS | 找不到「配置」入口'); finish(); return; }
          cfgBtn.click();
          setTimeout(phase2, 300);
        }

        /* 阶段二：配置态（服务清单 / 预设组 / 素材 三页签） */
        function phase2() {
          var tabs = qa('.cfg-tab');
          mark('配置态·三个页签', tabs.length === 3, tabs.length + ' 个');
          mark('配置态·服务清单表格（8 行）', qa('.cfg-table tbody tr').length === 8, qa('.cfg-table tbody tr').length + ' 行');
          mark('配置态·行内动作完整', qa('.cfg-rowacts').length === 8, qa('.cfg-rowacts').length + ' 组');
          mark('配置态·归属组标记', qa('.cfg-group').length >= 5, qa('.cfg-group').length + ' 处');
          mark('配置态·未分组标注', txt('.cfg-pane').indexOf('未分组') >= 0);

          if (tabs[1]) tabs[1].click();
          setTimeout(function () {
            mark('配置态·预设组组卡', qa('.group-card').length >= 2, qa('.group-card').length + ' 张');
            mark('配置态·组内成员有序', qa('.group-card .member-ord').length >= 4, qa('.group-card .member-ord').length + ' 行');
            if (tabs[2]) tabs[2].click();
            setTimeout(function () {
              mark('配置态·素材表（9 行）', qa('.cfg-table tbody tr').length === 9, qa('.cfg-table tbody tr').length + ' 行');
              mark('配置态·引用状态两种都有', txt('.cfg-pane').indexOf('未被任何服务引用') >= 0 && qa('.cfg-group').length >= 5,
                '被引用标记 ' + qa('.cfg-group').length + ' 处');
              mark('配置态·未被引用标注', txt('.cfg-pane').indexOf('未被任何服务引用') >= 0);
              mark('配置态·同名重复标注', txt('.cfg-pane').indexOf('同名重复') >= 0);
              mark('Carbon·配置态 0px 圆角', qa('.cfg-table, .group-card').every(function (e) {
                return getComputedStyle(e).borderTopLeftRadius === '0px';
              }));
              if (tabs[0]) tabs[0].click();
              setTimeout(function () {
                var editBtn = qa('.cfg-rowacts button[title="编辑定义"]')[0];
                if (!editBtn) { out.push('MISS | 找不到「编辑定义」入口'); finish(); return; }
                editBtn.click();
                setTimeout(function () {
                  mark('服务编辑·六段导航', qa('.edit-nav .nav-i').length === 6, qa('.edit-nav .nav-i').length + ' 段');
                  mark('服务编辑·六个分段', qa('.sec').length === 6, qa('.sec').length + ' 个');
                  var segIds = ['form', 'prep', 'start', 'ready', 'req', 'policy'].filter(function (s) { return !!document.getElementById('sec-' + s); });
                  mark('服务编辑·六段锚点齐全（摘要可跳转）', segIds.length === 6, segIds.join(','));
                  mark('服务编辑·校验摘要常驻', !!q('.nav-sum') && /6 段中/.test(txt('.nav-sum')), txt('.nav-sum').slice(0, 36));
                  mark('服务编辑·需求段给出四族', txt('#sec-req').indexOf('端口') >= 0 && txt('#sec-req').indexOf('依赖') >= 0);
                  mark('服务编辑·准备段诚实标注未支持', /尚未支持|还不支持/.test(txt('#sec-prep')), txt('#sec-prep').slice(0, 30));
                  mark('服务编辑·策略段区分启用与运行', txt('#sec-policy').indexOf('两个不同的状态位') >= 0);
                  mark('Carbon·服务编辑 0px 圆角', qa('.sec, .edit-nav').every(function (e) {
                    return getComputedStyle(e).borderTopLeftRadius === '0px';
                  }));
                  finish();
                }, 300);
              }, 250);
            }, 250);
          }, 250);
        }

        setTimeout(phase1, 400);
      });
    </script>
