    <!--
      结构探针：渲染完成后断言真实应用的 DOM 结构与 Carbon 不变式，
      结果写进 <pre id="dshverifyout">，由 shot-renderer.ps1 -Probe 用 --dump-dom 取回。
      （Chrome 的 --dump-dom 不输出 console，所以必须写进 DOM。）
    -->
    <script>
      window.addEventListener('load', function () {
        var out = [];
        function q(s) { return document.querySelector(s); }
        function qa(s) { return Array.prototype.slice.call(document.querySelectorAll(s)); }
        function txt(s) { var e = q(s); return e ? e.innerText.replace(/\s+/g, ' ') : ''; }
        function mark(n, ok, extra) { out.push((ok ? 'PASS' : 'FAIL') + ' | ' + n + (extra ? ' | ' + extra : '')); }
        function byText(t) {
          var c = qa('button,[role=button],a').filter(function (e) { return e.textContent.trim() === t; });
          return c[0] || null;
        }
        function finish() {
          var pre = document.createElement('pre');
          pre.id = 'dshverifyout';
          pre.textContent = out.join('\n');
          document.body.appendChild(pre);
        }

        /* 阶段一：运行态（用途卡 + 资源账本） */
        function phase1() {
          var purposes = qa('.purpose');
          mark('运行态·用途卡（2 个预设组）', purposes.length === 2, purposes.length + ' 张');
          mark('运行态·未分组单成员卡（3 个）', qa('.cards .card').length === 3, qa('.cards .card').length + ' 张');
          mark('运行态·用途卡可展开', qa('.purpose-toggle').length === purposes.length);
          mark('运行态·成员行存在', qa('.member').length >= 1, qa('.member').length + ' 行');
          mark('运行态·账本存在', !!q('.ledger') && txt('.ledger-head').indexOf('资源') >= 0);
          mark('运行态·账本显存读数', /GB/.test(txt('.ledger-sub')), txt('.ledger-sub').slice(0, 48));
          mark('运行态·账本行列', qa('.ledger-item').length >= 5, qa('.ledger-item').length + ' 行');
          mark('运行态·可启动与差容量', qa('.ledger-fit.ok').length >= 1 && qa('.ledger-fit.bad').length >= 1,
            '可启动 ' + qa('.ledger-fit.ok').length + ' · 差容量 ' + qa('.ledger-fit.bad').length);
          mark('Carbon·0px 圆角', qa('.purpose, .ledger, .btn').every(function (e) {
            return getComputedStyle(e).borderTopLeftRadius === '0px';
          }));
          mark('Carbon·卡片无投影', qa('.purpose, .ledger, .card').every(function (e) {
            return getComputedStyle(e).boxShadow === 'none';
          }));
          mark('Carbon·无渐变底', getComputedStyle(document.body).backgroundImage === 'none');
          mark('Carbon·正文 0.16px 字距', getComputedStyle(document.body).letterSpacing === '0.16px',
            getComputedStyle(document.body).letterSpacing);

          var cfgBtn = byText('配置');
          // 先展开 OpenViking 组，验证「启动中」不会显示成「已停止」
          // （状态名必须是主进程真实的 'starting'；写成 'loading' 会掉进 default 分支）
          var ov = null;
          for (var i = 0; i < purposes.length; i += 1) {
            var nm = purposes[i].querySelector('.purpose-name');
            if (nm && nm.textContent.trim() === 'OpenViking 组') { ov = purposes[i]; break; }
          }
          var ovToggle = ov ? ov.querySelector('.purpose-toggle') : null;
          if (ovToggle) ovToggle.click();
          setTimeout(function () {
            var states = qa('.purpose .member-state').map(function (e) { return e.textContent.trim(); });
            mark('运行态·启动中的成员显示「启动中」而非「已停止」', states.indexOf('启动中') >= 0, states.join('/'));
            if (!cfgBtn) { out.push('MISS | 找不到「配置」入口'); finish(); return; }
            cfgBtn.click();
            setTimeout(phase2, 300);
          }, 300);
        }

        /* 阶段二：配置态（服务清单 / 预设组 / 素材 三页签） */
        function phase2() {
          var tabs = qa('.cfg-tab');
          mark('配置态·三个页签', tabs.length === 3, tabs.length + ' 个');
          mark('配置态·服务清单表格（8 行）', qa('.cfg-table tbody tr').length === 8, qa('.cfg-table tbody tr').length + ' 行');
          mark('配置态·行内动作完整', qa('.cfg-rowacts').length === 8, qa('.cfg-rowacts').length + ' 组');
          mark('配置态·归属组标记', qa('.cfg-group').length >= 5, qa('.cfg-group').length + ' 处');
          mark('配置态·未分组标注', txt('.cfg-pane').indexOf('未分组') >= 0);

          if (tabs[1]) tabs[1].click();
          setTimeout(function () {
            mark('配置态·预设组组卡', qa('.group-card').length >= 2, qa('.group-card').length + ' 张');
            mark('配置态·组内成员有序', qa('.group-card .member-ord').length >= 4, qa('.group-card .member-ord').length + ' 行');
            if (tabs[2]) tabs[2].click();
            setTimeout(function () {
              mark('配置态·素材表（9 行）', qa('.cfg-table tbody tr').length === 9, qa('.cfg-table tbody tr').length + ' 行');
              mark('配置态·引用状态两种都有', txt('.cfg-pane').indexOf('未被任何服务引用') >= 0 && qa('.cfg-group').length >= 5,
                '被引用标记 ' + qa('.cfg-group').length + ' 处');
              mark('配置态·未被引用标注', txt('.cfg-pane').indexOf('未被任何服务引用') >= 0);
              mark('配置态·同名重复标注', txt('.cfg-pane').indexOf('同名重复') >= 0);
              mark('Carbon·配置态 0px 圆角', qa('.cfg-table, .group-card').every(function (e) {
                return getComputedStyle(e).borderTopLeftRadius === '0px';
              }));
              if (tabs[0]) tabs[0].click();
              setTimeout(function () {
                var editBtn = qa('.cfg-rowacts button[title="编辑定义"]')[0];
                if (!editBtn) { out.push('MISS | 找不到「编辑定义」入口'); finish(); return; }
                editBtn.click();
                setTimeout(function () {
                  mark('服务编辑·六段导航', qa('.edit-nav .nav-i').length === 6, qa('.edit-nav .nav-i').length + ' 段');
                  mark('服务编辑·六个分段', qa('.sec').length === 6, qa('.sec').length + ' 个');
                  var segIds = ['form', 'prep', 'start', 'ready', 'req', 'policy'].filter(function (s) { return !!document.getElementById('sec-' + s); });
                  mark('服务编辑·六段锚点齐全（摘要可跳转）', segIds.length === 6, segIds.join(','));
                  mark('服务编辑·校验摘要常驻', !!q('.nav-sum') && /6 段中/.test(txt('.nav-sum')), txt('.nav-sum').slice(0, 36));
                  mark('服务编辑·需求段给出四族', txt('#sec-req').indexOf('端口') >= 0 && txt('#sec-req').indexOf('依赖') >= 0);
                  mark('服务编辑·准备段诚实标注未支持', /尚未支持|还不支持/.test(txt('#sec-prep')), txt('#sec-prep').slice(0, 30));
                  mark('服务编辑·策略段区分启用与运行', txt('#sec-policy').indexOf('两个不同的状态位') >= 0);
                  mark('Carbon·服务编辑 0px 圆角', qa('.sec, .edit-nav').every(function (e) {
                    return getComputedStyle(e).borderTopLeftRadius === '0px';
                  }));
                  var setBtn = byText('设置');
                  if (!setBtn) { out.push('MISS | 找不到「设置」入口'); finish(); return; }
                  setBtn.click();
                  setTimeout(function () {
                    mark('设置·面板打开', !!q('.modal') && txt('.modal').indexOf('全局设置') >= 0);
                    mark('设置·三段结构', qa('.modal .sec-h').length === 3, qa('.modal .sec-h').length + ' 段');
                    mark('设置·快照表列出历史', qa('.modal .cfg-table tbody tr').length === 2, qa('.modal .cfg-table tbody tr').length + ' 行');
                    mark('设置·快照带原因与恢复键', txt('.modal').indexOf('保存前') >= 0 && qa('.modal button').some(function (b) { return /恢复/.test(b.textContent); }));
                    mark('设置·快照说明写明可逆', txt('.modal').indexOf('恢复本身也可逆') >= 0);
                    mark('Carbon·设置 0px 圆角', qa('.modal .sec-h, .modal .cfg-table').every(function (e) {
                      return getComputedStyle(e).borderTopLeftRadius === '0px';
                    }));
                    phase5();
                  }, 300);
                }, 300);
              }, 250);
            }, 250);
          }, 250);
        }

        /* 阶段五：预检决策面（从运行态点「聊天组」启用，资源不足应被挡住） */
        function phase5() {
          var closeBtn = byText('关闭');

          setTimeout(function () {
            var backBtn = q('.edit-h .btn');
            if (backBtn) backBtn.click();
            setTimeout(function () {
              var runBtn = byText('返回运行态');
              if (runBtn) runBtn.click();
              setTimeout(function () {
                var cards = qa('.purpose');

                  var n = cards[i].querySelector('.purpose-name');
                  if (n && n.textContent.trim() === '聊天组') { target = cards[i]; break; }
                }
                if (!target) { out.push('MISS | 找不到「聊天组」用途卡'); finish(); return; }
                var enable = target.querySelector('.btn.primary');
                if (!enable) { out.push('MISS | 「聊天组」没有启用按钮'); finish(); return; }
                enable.click();
                setTimeout(function () {
                  mark('预检·决策面弹出', !!q('.pf') && txt('.pf').indexOf('启动预检') >= 0);
                  mark('预检·四族齐全', qa('.pf-fam').length + qa('.pf-pass-row').length === 4,
                    '待处理 ' + qa('.pf-fam').length + ' · 通过 ' + qa('.pf-pass-row').length);
                  var resLine = (txt('.pf').match(/需要 [^，]*，余量 [^，]*，差 [^ ，]*/) || [''])[0];
                  mark('预检·资源族算出差额', /差/.test(resLine), resLine);
                  mark('预检·待处理族给出口动作', qa('.pf-acts button').length >= 1, qa('.pf-acts button').length + ' 个动作');
                  mark('预检·强制启动写明降级后果', txt('.pf').indexOf('强制启动不会让显存变多') >= 0);
                  mark('预检·来源可信度标注', txt('.pf').indexOf('来源：') >= 0);
                  mark('Carbon·预检 0px 圆角', qa('.pf-fam, .pf-passed').every(function (e) {
                    return getComputedStyle(e).borderTopLeftRadius === '0px';
                  }));
                  var cancel = byText('取消');
                  if (cancel) cancel.click();
                  phase6();
                }, 300);
              }, 300);
            }, 300);
          }, 300);
        }

        /* 阶段六：处置抽屉（状态 → 归因 → 修正动作 → 日志） */
        function phase6() {
          var logBtns = qa('.card-actions button').filter(function (b) { return b.textContent.trim() === '日志'; });
          if (!logBtns.length) { out.push('MISS | 找不到卡片上的「日志」入口'); finish(); return; }
          logBtns[0].click();
          setTimeout(function () {
            mark('抽屉·打开且分四段', !!q('.drawer') && qa('.drawer-sec').length === 4, qa('.drawer-sec').length + ' 段');
            mark('抽屉·状态键值表', qa('.drawer .kv .k').length >= 7, qa('.drawer .kv .k').length + ' 个字段');
            mark('抽屉·给出归因结论', !!q('.diag') && txt('.diag').length > 0, txt('.diag').slice(0, 34));
            mark('抽屉·标注置信度', !!q('.conf') && /证据|推断/.test(txt('.conf')), txt('.conf'));
            mark('抽屉·列出判断依据', qa('.drawer .ev-line').length >= 1, qa('.drawer .ev-line').length + ' 条依据');
            mark('抽屉·修正动作可点', qa('.drawer-acts button').length >= 2, qa('.drawer-acts button').length + ' 个动作');
            mark('抽屉·运行记录列出历史', qa('.drawer .cfg-table tbody tr').length === 3, qa('.drawer .cfg-table tbody tr').length + ' 行');
            mark('抽屉·运行记录标注结果与退出码', txt('.drawer .cfg-table').indexOf('失败') >= 0 && qa('.drawer .runout').length === 3);
            mark('抽屉·未结束的记录不编造时长', txt('.drawer .cfg-table').indexOf('—') >= 0);
            mark('抽屉·日志同屏可达', !!q('.drawer .log-viewer') && (txt('.drawer .log-viewer') || '').length > 10);
            mark('Carbon·抽屉 0px 圆角', qa('.drawer, .diag').every(function (e) {
              return getComputedStyle(e).borderTopLeftRadius === '0px';
            }));
            var closeBtn = q('.drawer-h button');
            if (closeBtn) closeBtn.click();
            finish();
          }, 400);
        }

        setTimeout(phase1, 400);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
